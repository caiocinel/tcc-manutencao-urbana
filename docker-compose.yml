services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/cloudflare:/etc/cloudflare:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: manutencao_urbana
      POSTGRES_USER: urbana
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbana -d manutencao_urbana"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    restart: unless-stopped

  backend:
    container_name: chamados-manutencao-urbana
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - IA_URL=http://ia:8000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_POOL_MAX=10
      - PRIVACY_BLUR_SIGMA=${PRIVACY_BLUR_SIGMA:-0.6}
      - PERIMETER_BUFFER_DEG=${PERIMETER_BUFFER_DEG:-0.01}
    volumes:
      - uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  ia:
    profiles: ["ia"]
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
      - CLASSIFICATION_API_KEY=${HUGGINGFACE_API_TOKEN:-}
      - CLASSIFICATION_API_URL=${CLASSIFICATION_API_URL:-https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
      - CLASSIFICATION_FORMAT=${CLASSIFICATION_FORMAT:-huggingface}
      - CLASSIFICATION_CATEGORIES=${CLASSIFICATION_CATEGORIES:-Buraco,Iluminacao,Semafaro,Arvore Caida,Entulho,Calcada Danificada,Outro}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 800M
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    image: alpine:3.19
    environment:
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD:-urbana123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - RCLONE_DEST=${RCLONE_DEST:-}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    entrypoint: >
      sh -c "
        apk add --no-cache postgresql-client curl &&
        echo '0 3 * * * /bin/sh /usr/local/bin/backup-postgres.sh' | crontab - &&
        echo 'Servico de backup iniciado — executa diariamente as 03:00' &&
        crond -f -l 2
      "

volumes:
  postgres-data:
  uploads:
  backend-logs:
  certbot-data:
  certbot-www:
  backups:

networks:
  app-network:
    driver: bridge
