version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network
    mem_limit: 50m
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/manutencao_urbana
      - JWT_SECRET=admin
      - FRONTEND_URL=http://localhost:3000
      - IA_URL=http://ia:8000
    depends_on:
      - mongo
    networks:
      - app-network
    mem_limit: 100m
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=manutencao_urbana
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network
    mem_limit: 128m
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.1", "--quiet"]

  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=production
      - CLASSIFICATION_API_KEY=${HUGGINGFACE_API_TOKEN:-}
      - CLASSIFICATION_API_URL=${CLASSIFICATION_API_URL:-https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
      - CLASSIFICATION_FORMAT=${CLASSIFICATION_FORMAT:-huggingface}
      - CLASSIFICATION_CATEGORIES=${CLASSIFICATION_CATEGORIES:-Buraco,Iluminação,Semáforo,Árvore Caída,Outro}
    networks:
      - app-network
    mem_limit: 50m
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
