services:
  nginx:
    image: nginx-frontend:latest
    network_mode: host
    volumes:
      - ./nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: manutencao_urbana
      POSTGRES_USER: urbana
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbana -d manutencao_urbana"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    restart: unless-stopped

  backend:
    container_name: chamados-manutencao-urbana
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - IA_URL=http://localhost:8000
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_NAME=manutencao_urbana
      - DB_USER=urbana
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_POOL_MAX=10
    volumes:
      - uploads:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    restart: unless-stopped

  ia:
    profiles: ["ia"]
    build:
      context: ./ia
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - PYTHON_ENV=production
      - CLASSIFICATION_API_KEY=${HUGGINGFACE_API_TOKEN:-}
      - CLASSIFICATION_API_URL=${CLASSIFICATION_API_URL:-https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
      - CLASSIFICATION_FORMAT=${CLASSIFICATION_FORMAT:-huggingface}
      - CLASSIFICATION_CATEGORIES=${CLASSIFICATION_CATEGORIES:-Buraco,Iluminação,Semáforo,Árvore Caída,Outro}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
  backend-logs:
  certbot-data:
  certbot-www:
