<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem Conexão — CIU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0d0d0f;
      color: #fafafa;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 360px;
    }
    .offline-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    h1 {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      padding: 10px 24px;
      background: #22c55e;
      color: #0a0a0b;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #16a34a; }
    .btn:active { transform: scale(0.97); }
    .offline-hint {
      margin-top: 16px;
      font-size: 13px;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <svg class="offline-icon" viewBox="0 0 512 512" fill="none">
      <rect width="512" height="512" rx="64" fill="#141517"/>
      <path d="M256 160v120M256 320v10" stroke="#22c55e" stroke-width="24" stroke-linecap="round"/>
      <path d="M120 140L392 380" stroke="#ef4444" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
      <rect x="130" y="180" width="252" height="200" rx="12" stroke="#22c55e" stroke-width="16" fill="none" opacity="0.3"/>
    </svg>
    <h1>Sem Conexão</h1>
    <p>Você está offline. Os dados exibidos podem estar desatualizados. Seus chamados serão enviados quando a conexão for restabelecida.</p>
    <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
    <p class="offline-hint">Seu navegador tentará reconectar automaticamente.</p>
  </div>
</body>
</html>
